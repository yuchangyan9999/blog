<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="/css/style.css">
  <meta name="description" content="我的个人博客网站">
</head>
<body>
  <header>
    <div class="container">
      <h1 class="site-title"><a href="/">个人博客</a></h1>
      <nav>
        <ul>
          <li><a href="/">首页</a></li>

          <li><a href="/search/">搜索</a></li>
          <li><a href="/about/">关于我</a></li>

      <div class="theme-switch-wrapper">
        <label class="theme-switch" for="checkbox">
          <input type="checkbox" id="checkbox" />
          <div class="slider round"></div>
        </label>
        <span class="theme-mode-text">夜间模式</span>

  <main class="container">
    
<div class="error-page">

</div>

<style>
  .error-page {
    text-align: center;
    padding: 50px 0;
  }
  .error-page h1 {
    font-size: 6rem;
    margin: 0;
    color: var(--primary-color);
  }
  .error-page h2 {
    font-size: 2rem;
    margin-bottom: 20px;
    color: var(--secondary-color);
  }
</style>

  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-section">
          <h3 class="footer-heading">关于博客</h3>
          <p>这是一个分享思考、知识与经验的个人博客。欢迎浏览文章并与我交流。</p>
        </div>
        
        <div class="footer-section">

            <li><a href="/">首页</a></li>
            <li><a href="/about/">关于我</a></li>
